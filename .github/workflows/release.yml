name: Release

# Bump VERSION (e.g. 1.0.1.0) and push to main: builds the plugin, publishes release v<VERSION>
# and adds it to manifest.json. The commit message becomes the changelog.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=. read -r a b c d < VERSION
          version="${a:-0}.${b:-0}.${c:-0}.${d:-0}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - name: Test
        if: steps.v.outputs.exists != 'true'
        run: dotnet test tests/PosterOverlays.Tests -c Release

      - name: Build
        if: steps.v.outputs.exists != 'true'
        run: |
          dotnet publish Jellyfin.Plugin.PosterOverlays -c Release -o out \
            -p:Version=${{ steps.v.outputs.version }} \
            -p:AssemblyVersion=${{ steps.v.outputs.version }} \
            -p:FileVersion=${{ steps.v.outputs.version }}
          zip -j "poster-overlays_${{ steps.v.outputs.version }}.zip" out/Jellyfin.Plugin.PosterOverlays.dll

      - name: Publish release
        if: steps.v.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "poster-overlays_${{ steps.v.outputs.version }}.zip" \
            --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --notes "$(git log -1 --format=%s)"

      - name: Update manifest.json
        if: steps.v.outputs.exists != 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          ZIP: poster-overlays_${{ steps.v.outputs.version }}.zip
        run: |
          python3 .github/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: add $VERSION"
          git push origin main
